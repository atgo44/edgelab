name: Actualizar y publicar

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Historial de predicciones (para marcar aciertos y fallos)
        uses: actions/cache@v4
        with:
          path: cache/pred_history.json
          key: pred-${{ github.run_id }}
          restore-keys: pred-
      - name: Parámetros validados por el backtest diario
        uses: actions/cache/restore@v4
        with:
          path: cache/backtest.json
          key: bt-
          restore-keys: bt-
      - name: Generar datos
        run: python export.py --dias 14 --sin-backtest
      - name: Versionar recursos (evita que el navegador use archivos viejos)
        run: |
          sed -i "s#app.js\"#app.js?v=${GITHUB_SHA}\"#; s#styles.css\"#styles.css?v=${GITHUB_SHA}\"#" site/index.html
          grep -n "?v=" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
