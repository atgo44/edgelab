name: Backtest diario del modelo

on:
  schedule:
    - cron: "20 3 * * *"   # 03:20 UTC = 22:20 hora Perú
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Buscar parámetros y validar contra el mercado (todas las ligas con cuotas)
        run: python backtest.py --todas --n 250 --paso 21
      - name: Guardar resultado para las publicaciones
        uses: actions/cache/save@v4
        with:
          path: cache/backtest.json
          key: bt-${{ github.run_id }}
